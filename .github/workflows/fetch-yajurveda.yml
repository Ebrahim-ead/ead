name: Fetch (শুক্ল যজুর্বেদ)

# ব্যবহারকারীর অনুরোধ: ebanglalibrary.com-এর «শুক্ল যজুর্বেদ সংহিতা
# (অনুবাদ : দুর্গাদাস লাহিড়ী)» হিন্দু সেকশনে যোগ করা। বই-পাতায় ৪০টি লেসন
# (পূর্বার্ধ অধ্যায় ১–২০, উত্তরার্ধ ২১–৪০) — প্রতিটি লেসন = এক অধ্যায়।
#
# স্যান্ডবক্স থেকে উৎস-সাইটে যাওয়া যায় না, তাই নামানোর কাজ এখানে (CI)।
# Actions-এর লগ বাইরে থেকে পড়া যায় না — তাই প্রতিটি ধাপের ফল শেল-tee দিয়ে
# assets/grantho/data/_debug/ ফাইলে লেখা হয় এবং প্রোব-ফল সঙ্গে সঙ্গে main-এ
# প্রকাশ করা হয়। ফলে পরের ধাপ ব্যর্থ হলেও কারণ জানা যায়।

on:
  workflow_dispatch:
    inputs:
      max:
        description: 'সর্বোচ্চ কত অধ্যায় (০ = সব)'
        default: '0'
  push:
    # এই ফাইল বদলালেই একবার চালাও (main-এ মার্জ হওয়ার সঙ্গে সঙ্গে) —
    # বাইরে থেকে workflow_dispatch চালানোর অনুমতি না থাকলেও কাজ এগোয়।
    branches: [main]
    paths:
      - '.github/workflows/fetch-yajurveda.yml'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: fetch-yajurveda
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      PYTHONUNBUFFERED: '1'
      BOT_BRANCH: arena/bot-yajurveda
      MAXV: ${{ inputs.max || '0' }}
      SLUG: yajurveda-shukla
      BOOK_TITLE: শুক্ল যজুর্বেদ সংহিতা
      DBG: assets/grantho/data/_debug
      BOOK_URL: https://www.ebanglalibrary.com/books/%e0%a6%b6%e0%a7%81%e0%a6%95%e0%a7%8d%e0%a6%b2-%e0%a6%af%e0%a6%9c%e0%a7%81%e0%a6%b0%e0%a7%8d%e0%a6%ac%e0%a7%87%e0%a6%a6-%e0%a6%b8%e0%a6%82%e0%a6%b9%e0%a6%bf%e0%a6%a4%e0%a6%be-%e0%a6%85%e0%a6%a8/
      LESSON_URL: https://www.ebanglalibrary.com/lessons/%e0%a7%a6%e0%a7%a7-%e0%a6%b6%e0%a7%81%e0%a6%95%e0%a7%8d%e0%a6%b2%e0%a6%af%e0%a6%9c%e0%a7%81%e0%a6%b0%e0%a7%8d%e0%a6%ac%e0%a7%87%e0%a6%a6-%e0%a6%aa%e0%a7%82%e0%a6%b0%e0%a7%8d%e0%a6%ac%e0%a6%be/
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: ঠিক করা (git)
        run: |
          git config user.name  "grantho-bot"
          git config user.email "bot@users.noreply.github.com"
          mkdir -p "$DBG"
          echo "রান: $GITHUB_RUN_ID · $(date -u '+%d/%m %H:%M:%S') UTC · sha ${GITHUB_SHA:0:7}" > "$DBG/yajurveda_run.txt"

      # ── ০) উৎস-প্রোব ───────────────────────────────────────────
      # বইটি লগইন-গেটেড কি না, বই-পাতায় কত লেসন আছে, এক লেসনে আসলেই
      # মন্ত্র-পাঠ পার্স হয় কি না। ফল শেল-tee দিয়ে ফাইলে — পাইথন মাঝপথে থামলেও
      # ততটুকু আউটপুট থেকে যায়।
      - name: ০) উৎস-প্রোব
        run: |
          python3 -u - 2>&1 <<'PY' | tee "$DBG/yajurveda_probe.txt"
          import os, re, sys, urllib.parse
          sys.path.insert(0, 'tools')
          import fetch_ebl as F

          book = os.environ['BOOK_URL']; lesson = os.environ['LESSON_URL']
          wall_re = re.compile(r'requires a login|Accessing this book|ld-user-register', re.I)
          deva = re.compile(r'[\u0904-\u0939\u093D\u0950\u0958-\u0961\u0972-\u097F]')

          def show(label, url):
              print(f'--- {label}: {urllib.parse.unquote(url)[-70:]}')
              try:
                  h = F.get(url, tries=2, timeout=30) or ''
                  print(f'    html: {len(h)} B')
              except Exception as e:
                  print(f'    get ব্যর্থ: {type(e).__name__} {e}'); h = ''
              txt = ''
              try:
                  txt = F.fetch_paged(url) or ''
                  print(f'    text: {len(txt)} B')
              except Exception as e:
                  print(f'    fetch_paged ব্যর্থ: {type(e).__name__} {e}')
              try:
                  vs = F.parse_verses(txt) or []
              except Exception as e:
                  print(f'    parse_verses ব্যর্থ: {type(e).__name__} {e}'); vs = []
              blob = txt + h
              print(f'    মন্ত্র: {len(vs)} · লগইন-দেয়াল: {bool(wall_re.search(blob))}')
              for v in vs[:2]:
                  print(f'    নমুনা n={v.get("n")} bn={len(str(v.get("bn") or ""))} অক্ষর '
                        f'sk-দেবনাগরী={bool(deva.search(str(v.get("sk") or "")))}')
              return vs

          print('=== শুক্ল যজুর্বেদ — উৎস-প্রোব ===')
          lessons = []
          try:
              lessons = F.book_lessons(book) or []
              print(f'বই-পাতার সূচিতে লেসন: {len(lessons)}')
              for u in lessons[:3]:
                  print('   · ' + urllib.parse.unquote(u)[-70:])
              if len(lessons) > 3:
                  print('   · …')
                  for u in lessons[-2:]:
                      print('   · ' + urllib.parse.unquote(u)[-70:])
          except Exception as e:
              print(f'বই-পাতা পড়া যায়নি: {type(e).__name__} {e}')

          show('ব্যবহারকারীর লেসন', lesson)
          if lessons and lessons[0] != lesson:
              show('সূচির প্রথম লেসন', lessons[0])
          if len(lessons) > 1:
              show('সূচির দ্বিতীয় লেসন', lessons[1])

          try:
              sm = F.sitemap_urls(F.TOPIC_SITEMAPS + F.LESSON_SITEMAPS, 'যজুর্বেদ')
              print(f'সাইটম্যাপে «যজুর্বেদ» মিল: {len(sm)}')
              for u in sm[:8]:
                  print('   · ' + urllib.parse.unquote(u)[-72:])
          except Exception as e:
              print(f'সাইটম্যাপ-খোঁজ ব্যর্থ: {type(e).__name__} {e}')
          print('=== প্রোব শেষ ===')
          PY
          echo "প্রোব-ফাইল: $(wc -c < "$DBG/yajurveda_probe.txt") B" || true

      # ── ০.৫) প্রোব-ফল সঙ্গে সঙ্গে main-এ প্রকাশ ─────────────────
      # পরের ধাপগুলো ব্যর্থ হলেও কারণটি যেন পড়া যায়।
      - name: ০.৫) প্রোব-ফল প্রকাশ
        run: |
          git add "$DBG" || true
          if git diff --cached --quiet; then
            echo 'প্রোব-ফলে নতুন কিছু নেই'
            exit 0
          fi
          git commit -m "শুক্ল যজুর্বেদ: উৎস-প্রোব ফল ($(date -u '+%d/%m %H:%M') UTC)" || exit 1
          git fetch origin main --depth=1 || true
          git rebase origin/main || git rebase --abort || true
          if ! git push origin HEAD:main; then
            echo '⚠ main-এ সরাসরি push ব্যর্থ — ডায়াগনস্টিক পরে বট-ব্র্যাঞ্চ দিয়ে যাবে'
            git reset --soft HEAD~1 || true
          fi

      # ── ১) পাঠ নামানো ──────────────────────────────────────────
      # fetch_ebl.py-তে --book একটি ফ্ল্যাগ, বই-পাতার ঠিকানা --url-এ যায়।
      # পথ: বই-পাতার সূচি → সাইটম্যাপ থেকে বই খোঁজা → ঠিকানা-প্রিফিক্স →
      # একক লেসন। --only-unsaved: পরের রানে শুধু বাকি অধ্যায় নামে।
      - name: ১) অধ্যায় নামানো
        run: |
          COMMON=(--slug "$SLUG" --title "$BOOK_TITLE" --word মন্ত্র --only-unsaved)
          if [ "$MAXV" != "0" ]; then COMMON+=(--max "$MAXV"); fi

          count () {
            python3 -c '
          import json, os
          p = "assets/grantho/data/" + os.environ["SLUG"] + "/index.json"
          try:
              d = json.load(open(p, encoding="utf-8"))
              print(sum(int(c.get("count") or 0) for c in d.get("chapters", [])))
          except Exception:
              print(0)'
          }
          run_fetch () {
            local label="$1"; shift
            echo "" >> "$DBG/yajurveda_fetch.txt"
            echo "── চেষ্টা: $label → tools/fetch_ebl.py $*" >> "$DBG/yajurveda_fetch.txt"
            # লেবেল/টেইল stderr-এ — stdout-এ কেবল count, নইলে N=$(run_fetch …) নষ্ট হয়
            echo "── চেষ্টা: $label" >&2
            python3 -u tools/fetch_ebl.py "${COMMON[@]}" "$@" >> "$DBG/yajurveda_fetch.txt" 2>&1 \
              || echo "⚠ ফেচার অশূন্য কোডে শেষ হলো (বিস্তারিত ফাইলে)" >> "$DBG/yajurveda_fetch.txt"
            tail -12 "$DBG/yajurveda_fetch.txt" >&2
            count
          }

          : > "$DBG/yajurveda_fetch.txt"
          N=$(run_fetch "বই-পাতার সূচি" --book --url "$BOOK_URL")
          echo "মন্ত্র: $N"
          if [ "$N" = "0" ]; then
            N=$(run_fetch "সাইটম্যাপ থেকে বই" --book-auto --match "শুক্ল যজুর্বেদ|শুক্লযজুর্বেদ")
            echo "মন্ত্র: $N"
          fi
          if [ "$N" = "0" ]; then
            N=$(run_fetch "ঠিকানা-প্রিফিক্স" --prefix শুক্লযজুর্বেদ)
            echo "মন্ত্র: $N"
          fi
          if [ "$N" = "0" ]; then
            N=$(run_fetch "একক লেসন" --url "$LESSON_URL")
            echo "মন্ত্র: $N"
          fi
          echo "চূড়ান্ত: $N মন্ত্র"
          echo "" >> "$DBG/yajurveda_fetch.txt"
          echo "চূড়ান্ত: $N মন্ত্র" >> "$DBG/yajurveda_fetch.txt"

      # ── ১.৫) পরিষ্কারক ─────────────────────────────────────────
      # নামানো ডেটায় ভূমিকা/অনুক্রমণিকা-খণ্ড মন্ত্র-নম্বরের সাথে মিশে থাকে, কয়েকটি
      # খণ্ডের বাংলা পাঠ ভুল করে sk ঘরে যায়, আর শিরোনাম কাটা-ছাঁটা ঠিকানা-টুকরো
      # হয়ে আসে — tools/clean_yajurveda.py এগুলো ঠিক করে (আইডেমপোটেন্ট)।
      - name: ১.৫) ডেটা পরিষ্কার
        if: always()
        run: |
          # কেন `|| true` নয়: পরিষ্কারক ব্যর্থ হলে (মোট অক্ষর বদলে গেছে) কাঁচা ডেটা
          # প্রকাশিত হয়ে যেত — অর্থাৎ মন্ত্রের নম্বর আবার উল্টাপাল্টা (১১ নম্বর অধ্যায়ে
          # ৫৫টি মন্ত্রে ১–৮৩) এবং ভূমিকা আবার মন্ত্র-তালিকায় মিশে যেত। তাই ব্যর্থ হলে
          # আগে থেকে যাচাই-হওয়া ডেটাই ফিরিয়ে আনা হয়, আর কারণটি রিপোর্টে থাকে।
          set +e
          python3 -u tools/clean_yajurveda.py > "$DBG/yajurveda_clean.txt" 2>&1
          st=$?
          # নম্বর ও বানানের স্বতন্ত্র যাচাই (পরিষ্কারক পাস করলেও ডেটা ফাইলে হাত পড়তে পারে)
          python3 -u - <<'PY' >> "$DBG/yajurveda_clean.txt" 2>&1
          import json, os, pathlib, sys
          d = pathlib.Path('assets/grantho/data') / os.environ['SLUG']
          bad = []
          idx = d / 'index.json'
          if idx.exists():
              for c in json.loads(idx.read_text(encoding='utf-8')).get('chapters', []):
                  fp = d / f'ch{c["id"]}.json'
                  if not fp.exists():
                      bad.append(f'অধ্যায় {c["id"]}: ফাইল নেই'); continue
                  j = json.loads(fp.read_text(encoding='utf-8'))
                  ns = [v.get('n') for v in j.get('verses', [])]
                  if ns != list(range(1, len(ns) + 1)):
                      bad.append(f'অধ্যায় {c["id"]}: নম্বর ১..{len(ns)} ক্রমে নয়')
                  if not j.get('preface'):
                      bad.append(f'অধ্যায় {c["id"]}: অনুক্রমণিকা ঘর ফাঁকা')
                  blob = json.dumps(j, ensure_ascii=False)
                  if 'ৰ' in blob or 'ৱ' in blob:
                      bad.append(f'অধ্যায় {c["id"]}: অসম বানান ৰ/ৱ রয়ে গেছে')
          else:
              bad.append('index.json নেই')
          print('নম্বর-যাচাই: ' + ('ব্যর্থ → ' + '; '.join(bad) if bad else 'পাস (৪০ অধ্যায়ে ১..N, বানান ঠিক)'))
          sys.exit(1 if bad else 0)
          PY
          chk=$?
          set -e
          if [ "$st" -ne 0 ] || [ "$chk" -ne 0 ]; then
            echo "!! পরিষ্কারক/যাচাই ব্যর্থ (exit $st/$chk) — আগের যাচাই-হওয়া ডেটা ফেরানো হলো" \
              >> "$DBG/yajurveda_clean.txt"
            git checkout -- "assets/grantho/data/$SLUG" || true
          fi
          tail -8 "$DBG/yajurveda_clean.txt" || true

      # ── ২) ফল-রিপোর্ট ──────────────────────────────────────────
      - name: ২) ফল-রিপোর্ট
        if: always()
        run: |
          python3 -u - 2>&1 <<'PY' | tee "$DBG/yajurveda_report.txt"
          import json, os, pathlib, re
          slug = os.environ['SLUG']
          d = pathlib.Path('assets/grantho/data') / slug
          deva = re.compile(r'[\u0904-\u0939\u093D\u0950\u0958-\u0961\u0972-\u097F]')
          print('=== শুক্ল যজুর্বেদ — ফল ===')
          idx = d / 'index.json'
          if idx.exists():
              j = json.loads(idx.read_text(encoding='utf-8'))
              chs = j.get('chapters', [])
              print(f'মোট: {j.get("total")} {j.get("verseWord", "মন্ত্র")} · '
                    f'বাংলাসহ: {j.get("withBn")} · অধ্যায়: {len(chs)}')
              sk = bn = tot = 0
              for c in chs:
                  fp = d / f'ch{c["id"]}.json'
                  if not fp.exists():
                      print(f'  অধ্যায় {c["id"]}: ফাইল নেই'); continue
                  vs = json.loads(fp.read_text(encoding='utf-8')).get('verses', [])
                  tot += len(vs)
                  bn += sum(1 for v in vs if str(v.get('bn') or '').strip())
                  sk += sum(1 for v in vs if deva.search(str(v.get('sk') or '')))
                  print(f'  অধ্যায় {c["id"]}: {len(vs)} মন্ত্র · {c.get("bn") or c.get("title") or ""}')
              print(f'যাচাই: মন্ত্র {tot} · বাংলা {bn} · আসল দেবনাগরী সংস্কৃত {sk}')
          else:
              print('index.json তৈরি হয়নি — উৎস থেকে কিছু নামেনি।')
              print('সম্ভাব্য কারণ: লেসন-পাতা লগইন ছাড়া পাঠ দেয় না (প্রোব-রিপোর্টে '
                    '«লগইন-দেয়াল: True» দেখা গেলে এটাই কারণ)।')
          print('=== রিপোর্ট শেষ ===')
          PY
          true

      # ── ৩) সাইট-পাতা বিল্ড ─────────────────────────────────────
      - name: ৩) সাইট-পাতা বিল্ড
        if: always()
        run: |
          python3 -u tools/build_pages.py 2>&1 | tee -a "$DBG/yajurveda_run.txt" | tail -15 || true

      # ── ৪) কমিট + প্রকাশ ──────────────────────────────────────
      # ডেটা/পাতা থাকলে তা-ও, না থাকলে অন্তত ডায়াগনস্টিক ফাইলগুলো — সবসময় প্রকাশ।
      - name: ৪) কমিট + প্রকাশ
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "── git status:"
            git status --porcelain
            echo "── ডাটা ফোল্ডার:"
            ls -la "assets/grantho/data/$SLUG" 2>&1 | head -8
            echo "── শেষ: $(date -u '+%d/%m %H:%M:%S') UTC"
          } >> "$DBG/yajurveda_run.txt"
          git add -A || true
          if git diff --cached --quiet; then
            echo 'প্রকাশ করার মতো কিছু নেই'
            exit 0
          fi
          git commit -m "শুক্ল যজুর্বেদ: নামানো পাঠ ও ডায়াগনস্টিক ($(date -u '+%d/%m %H:%M') UTC)" || exit 1
          git fetch origin main --depth=1 || true
          git rebase origin/main || git rebase --abort || true
          if git push origin HEAD:main; then
            echo '✓ main-এ প্রকাশ হয়েছে'
            exit 0
          fi
          # সরাসরি push না চললে বট-ব্র্যাঞ্চ → PR → merge
          echo 'সরাসরি push ব্যর্থ — বট-ব্র্যাঞ্চ দিয়ে চেষ্টা'
          git fetch origin "${BOT_BRANCH}" --depth=1 || true
          if ! git push origin "HEAD:refs/heads/${BOT_BRANCH}" \
             && ! git push --force origin "HEAD:refs/heads/${BOT_BRANCH}"; then
            echo '⛔ বট-ব্র্যাঞ্চেও push হলো না' >&2
            exit 1
          fi
          NUM=$(gh pr list --head "${BOT_BRANCH}" --state open --json number -q '.[0].number' || true)
          if [ -z "$NUM" ]; then
            gh pr create --base main --head "${BOT_BRANCH}" \
              --title "শুক্ল যজুর্বেদ: নামানো পাঠ ও ডায়াগনস্টিক ($(date -u '+%d/%m %H:%M') UTC)" \
              --body "রিপোর্ট: assets/grantho/data/_debug/yajurveda_report.txt" || true
            sleep 5
            NUM=$(gh pr list --head "${BOT_BRANCH}" --state open --json number -q '.[0].number' || true)
          fi
          if [ -z "$NUM" ]; then echo '⛔ PR তৈরি হয়নি' >&2; exit 1; fi
          gh pr merge "$NUM" --merge || { echo "⛔ merge ব্যর্থ (PR #$NUM)" >&2; exit 1; }
          echo "✓ প্রকাশ হয়েছে (PR #$NUM)"
