name: Fetch Bengali (ebanglalibrary)

on:
  push:
    paths:
      - '.github/workflows/fetch-ebl.yml'
      - 'tools/fetch_ebl.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch-ebl
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      # ---- প্রথম রান: URL-আবিষ্কার + ছান্দোগ্য (৮ অধ্যায়) ----
      KW: 'ভবিষ্য পুরাণ'
      SLUG: 'rigveda'
      TITLE: 'ঋগ্বেদ'
      MATCH: 'ঋগ্বেদ ০'
      ORDINAL: '0'
      CHAIN: '0'
      BOOK: '0'
      GROUPNUM: '1'
      URL: ''
      MAXN: '0'
      STARTN: '1'
      WORD: 'সূক্ত'
      DUMPN: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Discover (URL তালিকা)
        continue-on-error: true
        run: |
          mkdir -p assets/grantho/data/_debug
          : > assets/grantho/data/_debug/urls.txt
          IFS=',' read -ra arr <<< "$KW"
          for k in "${arr[@]}"; do
            echo "=== $k ===" >> assets/grantho/data/_debug/urls.txt
            python3 tools/fetch_ebl.py --discover --match "$k" 2>&1 | tee -a assets/grantho/data/_debug/urls.txt
            echo >> assets/grantho/data/_debug/urls.txt
          done
          wc -l assets/grantho/data/_debug/urls.txt

      - name: Fetch (উপনিষদ + পুরাণ)
        continue-on-error: true
        run: |
          set -x
          : > /tmp/fetch.log
          run() {
            echo "### $*"
            python3 -u tools/fetch_ebl.py "$@" 2>&1 | tee -a /tmp/fetch.log
            sleep 1
          }
          # ---- বাকি উপনিষদ (ঈশ/কেন/প্রশ্ন/মুণ্ডক/মাণ্ডূক্য/তৈত্তিরীয়/ঐতরেয়)
          run --slug upanishad-kena --title "কেন উপনিষদ" --word মন্ত্র \
              --match "কেন উপনিষদ" --by-ordinal --max 30
          run --slug upanishad-isha --title "ঈশ উপনিষদ" --word মন্ত্র \
              --match "ঈশ উপনিষদ" --by-ordinal --max 30
          run --slug upanishad-prashna --title "প্রশ্ন উপনিষদ" --word মন্ত্র \
              --match "প্রশ্ন উপনিষদ" --by-ordinal --max 30
          run --slug upanishad-mundaka --title "মুণ্ডক উপনিষদ" --word মন্ত্র \
              --match "মুণ্ডক উপনিষদ" --by-ordinal --max 30
          run --slug upanishad-mandukya --title "মাণ্ডূক্য উপনিষদ" --word মন্ত্র \
              --match "মাণ্ডূক্য উপনিষদ" --by-ordinal --max 30
          run --slug upanishad-taittiriya --title "তৈত্তিরীয় উপনিষদ" --word মন্ত্র \
              --match "তৈত্তিরীয় উপনিষদ" --by-ordinal --max 30
          run --slug upanishad-aitareya --title "ঐতরেয় উপনিষদ" --word মন্ত্র \
              --match "ঐতরেয় উপনিষদ" --by-ordinal --max 30

          echo "শেষ $(date -u +%H:%M:%S)"

      - name: Report
        if: always()
        run: |
          mkdir -p assets/grantho/data/_debug
          cp /tmp/fetch.log assets/grantho/data/_debug/fetch_log.txt 2>/dev/null || true
          echo "ক্যাশ ফাইল:"; ls -la assets/grantho/data/_debug/ || true
          echo "=== log tail ==="
          tail -40 /tmp/fetch.log 2>/dev/null || true
          echo "=== report ==="
          cat "assets/grantho/data/_fetch_report_${SLUG}.txt" 2>/dev/null || echo "(no report)"
          echo "=== all reports ==="
          for r in assets/grantho/data/_fetch_report_*.txt; do cat "$r"; echo; done 2>/dev/null || true
          echo "=== sample ch1 ==="
          python3 - <<'PY' || true
          import json, os
          f = "assets/grantho/data/%s/ch1.json" % os.environ["SLUG"]
          if os.path.exists(f):
              o = json.load(open(f, encoding="utf-8"))
              print("count:", o["count"], "| bn:", o["bn"])
              for v in o["verses"][:2]:
                  print("N:", v["n"])
                  print("SK:", (v.get("sk") or "")[:260])
                  print("BN:", (v.get("bn") or "")[:260])
                  print("--")
          else:
              print("(no ch1.json)")
          PY

      - name: Commit & push
        if: always()
        run: |
          git config user.name  "grantho-bot"
          git config user.email "bot@users.noreply.github.com"
          git add assets/grantho/data || true
          git commit -m "ebanglalibrary: ${SLUG} ($(date -u +%H:%M))" || echo "no changes"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
          git push origin "HEAD:${GITHUB_REF_NAME}" || echo "push skipped"
