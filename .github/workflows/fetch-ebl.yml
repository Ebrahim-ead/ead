name: Fetch Bengali (ebanglalibrary)

on:
  push:
    paths:
      - '.github/workflows/fetch-ebl.yml'
      - 'tools/fetch_ebl.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch-ebl
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      # ---- : URL-আবিষ্কার + ছান্দোগ্য (৮ অধ্যায়) ----
      KW: 'অথর্ববেদ সংহিতা'
      SLUG: 'atharvaveda'
      TITLE: 'অথর্ববেদ সংহিতা'
      MATCH: 'অথর্ববেদ সংহিতা'
      ORDINAL: '0'
      CHAIN: '0'
      BOOK: '0'
      GROUPNUM: '1'
      URL: ''
      MAXN: '0'
      STARTN: '1'
      WORD: 'সূক্ত'
      DUMPN: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Discover (URL তালিকা)
        continue-on-error: true
        run: |
          mkdir -p assets/grantho/data/_debug
          : > assets/grantho/data/_debug/urls.txt
          IFS=',' read -ra arr <<< "$KW"
          for k in "${arr[@]}"; do
            echo "=== $k ===" >> assets/grantho/data/_debug/urls.txt
            python3 tools/fetch_ebl.py --discover --match "$k" 2>&1 | tee -a assets/grantho/data/_debug/urls.txt
            echo >> assets/grantho/data/_debug/urls.txt
          done
          wc -l assets/grantho/data/_debug/urls.txt

      - name: Debug (কাঁচা পাঠ ডাম্প)
        continue-on-error: true
        run: |
          python3 - <<'PY' 2>&1 | tee assets/grantho/data/_debug/dbg3.txt
          import sys, os, re, urllib.parse
          sys.path.insert(0, "tools")
          import fetch_ebl as f
          os.makedirs("assets/grantho/data/_debug/raw", exist_ok=True)
          jobs = [
              ("atharva", "অথর্ববেদ সংহিতা", "lessons"),
              ("garuda", "গরুড় পুরাণ পৃথ্বীরাজ", "lessons"),
              ("bhabishya", "ভবিষ্য পুরাণ", "lessons"),
              ("samaveda", "সামবেদ সংহিতা", "lessons"),
              ("yajurveda", "যজুর্বেদ সংহিতা", "lessons"),
              ("rigveda", "ঋগ্বেদ ০১", "topics"),
          ]
          for tag, kw, want in jobs:
              allu = f.sitemap_urls(f.LESSON_SITEMAPS + f.TOPIC_SITEMAPS, kw, (want,))
              if not allu:
                  print("=====", tag, "সাইটম্যাপে নেই"); continue
              url0 = sorted(allu, key=lambda x: len(urllib.parse.unquote(x)))[0]
              print("=====", tag, "|", urllib.parse.unquote(url0)[-50:], "| মোট:", len(allu))
              toc = f.toc_links(url0)
              print("   ভেতরের টপিক:", len(toc))
              picks = [url0] + toc[:2]
              for k, u in enumerate(picks):
                  t = f.fetch_paged(u)
                  fn = "assets/grantho/data/_debug/raw/%s_%d.txt" % (tag, k)
                  open(fn, "w", encoding="utf-8").write(t)
                  print("   →", fn, "| লাইন:", len([x for x in t.splitlines() if x.strip()]),
                        "| দেবনাগরী:", len(re.findall(r"[\u0900-\u097F]", t)),
                        "| ॥:", t.count("॥"), "| :", t.count(":"))
          PY

      - name: Fetch (উপনিষদ + পুরাণ)
        continue-on-error: true
        run: |
          set -x
          : > /tmp/fetch.log
          run() {
            echo "### $*"
            python3 -u tools/fetch_ebl.py "$@" 2>&1 | tee -a /tmp/fetch.log
            sleep 1
          }
          # ---- অথর্ববেদ: কোর্স-পাতার ভেতরের সব অধ্যায় (টপিক)
          run --slug atharvaveda --title "অথর্ববেদ সংহিতা" --word মন্ত্র \
              --url "https://www.ebanglalibrary.com/lessons/অথর্ববেদ-সংহিতা-১৮।০৩-অষ/" \
              --toc --max 80

          echo "শেষ $(date -u +%H:%M:%S)"

      - name: Report
        if: always()
        run: |
          mkdir -p assets/grantho/data/_debug
          cp /tmp/fetch.log assets/grantho/data/_debug/fetch_log.txt 2>/dev/null || true
          echo "ক্যাশ ফাইল:"; ls -la assets/grantho/data/_debug/ || true
          echo "=== log tail ==="
          tail -40 /tmp/fetch.log 2>/dev/null || true
          echo "=== report ==="
          cat "assets/grantho/data/_fetch_report_${SLUG}.txt" 2>/dev/null || echo "(no report)"
          echo "=== all reports ==="
          for r in assets/grantho/data/_fetch_report_*.txt; do cat "$r"; echo; done 2>/dev/null || true
          echo "=== sample ch1 ==="
          python3 - <<'PY' || true
          import json, os
          f = "assets/grantho/data/%s/ch1.json" % os.environ["SLUG"]
          if os.path.exists(f):
              o = json.load(open(f, encoding="utf-8"))
              print("count:", o["count"], "| bn:", o["bn"])
              for v in o["verses"][:2]:
                  print("N:", v["n"])
                  print("SK:", (v.get("sk") or "")[:260])
                  print("BN:", (v.get("bn") or "")[:260])
                  print("--")
          else:
              print("(no ch1.json)")
          PY

      - name: Commit & push
        if: always()
        run: |
          git config user.name  "grantho-bot"
          git config user.email "bot@users.noreply.github.com"
          git add assets/grantho/data || true
          git commit -m "ebanglalibrary: ${SLUG} ($(date -u +%H:%M))" || echo "no changes"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
          git push origin "HEAD:${GITHUB_REF_NAME}" || echo "push skipped"
