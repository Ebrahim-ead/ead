name: Fetch (ebanglalibrary)

# উৎস থেকে পাঠ নামায় ও ডেটা আপডেট করে, তারপর সাইটে প্রকাশ করে।
# পরিধি (ব্যবহারকারীর সিদ্ধান্ত): কেবল গীতা + ঋগ্বেদ।
#   · গীতা সম্পূর্ণ (৭০১ শ্লোক) — নতুন কিছু নামানোর দরকার নেই।
#   · ঋগ্বেদ ১–৯ মণ্ডল সম্পূর্ণ; বাকি **১০ম মণ্ডল** (১৯১২ সূক্ত/মন্ত্র)।

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'কী নামাব'
        type: choice
        default: rigveda10
        options: [rigveda10, gita, all]
      max:
        description: 'সর্বোচ্চ কতটি সূক্ত (০ = সব)'
        default: '0'
  schedule:
    # রাতে একবার — ১০ম মণ্ডলের বাকি অংশ ধীরে ধীরে যোগ হবে
    - cron: '40 19 * * *'
  push:
    # এই ফাইল বা ফেচার বদলালে সঙ্গে সঙ্গে একবার চালাও (main-এ merge হলেই)
    branches: [main]
    paths:
      - '.github/workflows/fetch-ebl.yml'
      - 'tools/fetch_ebl.py'

permissions:
  contents: write

concurrency:
  group: fetch-ebl
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      PYTHONUNBUFFERED: '1'
      BOT_BRANCH: arena/bot-fetch
      TARGET: ${{ inputs.target || 'rigveda10' }}
      MAXV: ${{ inputs.max || '0' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: git
        run: |
          git config user.name  "grantho-bot"
          git config user.email "bot@users.noreply.github.com"

      # ── ঋগ্বেদ ১০ম মণ্ডল ────────────────────────────────────────────────
      # সূত্র-পাতার নাম «ঋগ্বেদ-১০।০১» … «ঋগ্বেদ-১০।১৯১» — সংখ্যা ধরে মিলিয়ে
      # একবারে পুরো মণ্ডল ধরা হয়। --only-unsaved থাকায় প্রতিবার কেবল নতুন
      # সূক্তগুলোই নামে, আর write_index_guarded পুরনো ১–৯ মণ্ডল অটুট রাখে।
      # লগ দেখা যায় না — তাই রান নিজেই ফল লিখে রাখে (assets/grantho/data/_debug/probe.txt)
      - name: ঋগ্বেদ — উৎস যাচাই (ফাইলে লিখে রাখে)
        run: |
          mkdir -p assets/grantho/data/_debug
          python3 -u - <<'PY'
          import sys, urllib.parse
          sys.path.insert(0, 'tools')
          import fetch_ebl as F

          out = []
          def rec(label, url):
              h = F.get(url, tries=1, timeout=25)
              t = F.toc_links(url) if h else []
              out.append(f"{label} | {urllib.parse.unquote(url)} | "
                         f"{('OK len=%d' % len(h)) if h else 'FAIL'} | links={len(t)}")
              for u in t[:4]:
                  out.append("     · " + urllib.parse.unquote(u))
              print(out[-1])

          rec('toc-10।০১', f"{F.BASE}/topics/ঋগ্বেদ-১০।০১/")
          rec('toc-10।01', f"{F.BASE}/topics/ঋগ্বেদ-১০।01/")
          rec('toc-10',    f"{F.BASE}/topics/ঋগ্বেদ-১০/")
          rec('toc-09।০১', f"{F.BASE}/topics/ঋগ্বেদ-০৯।০১/")
          rec('home', F.BASE + "/")
          urls = F.sitemap_urls(F.TOPIC_SITEMAPS, "ঋগ্বেদ")
          out.append(f"সাইটম্যাপে ঋগ্বেদ: {len(urls)} · সব URL: {len(F._ALL)}")
          m10 = [u for u in F._ALL if "ঋগ্বেদ-১০।" in urllib.parse.unquote(u)]
          m9 = [u for u in F._ALL if "ঋগ্বেদ-৯।" in urllib.parse.unquote(u)]
          out.append(f"মণ্ডল ১০ (সাইটম্যাপ): {len(m10)} · মণ্ডল ৯ (সাইটম্যাপ): {len(m9)}")
          got = F.mandala_links(10)
          out.append(f"mandala_links(10) → {len(got)}")
          out.append(f"সাইট-ব্যর্থতা গণনা: {F._DOWN['n']}")
          open('assets/grantho/data/_debug/probe.txt', 'w', encoding='utf-8').write(
              "\n".join(out) + "\n")
          print("\n".join(out))
          PY
          # সাথে সাথে main-এ পাঠাই — পরের ধাপ ব্যর্থ হলেও ফল থেকে যায়
          git add -f assets/grantho/data/_debug/probe.txt
          git commit -m "উৎস-যাচাই: probe ($(date -u +%H:%M))" || true
          git fetch origin main --depth=1 || true
          git push origin HEAD:main || echo "probe push হলো না"

      - name: ঋগ্বেদ — ১০ম মণ্ডল (বাকি সূক্ত)
        if: env.TARGET != 'gita'
        run: |
          ARGS=""
          if [ "$MAXV" != "0" ]; then ARGS="--max $MAXV"; fi
          python3 -u tools/fetch_ebl.py --slug rigveda --title "ঋগ্বেদ সংহিতা" \
            --word সূক্ত --match "ঋগ্বেদ" --by-ordinal --want 10 \
            --into-chapter 10 --only-unsaved $ARGS 2>&1 | tail -40

      # প্রথম চেষ্টায় সূচি না মিললে একবার হালকা করে (২৫০ সূক্ত) আবার
      - name: ঋগ্বেদ ১০ম মণ্ডল — ফল না এলে একবার পুনরায়
        if: env.TARGET != 'gita'
        run: |
          python3 - <<'PY'
          import json
          try:
              d = json.load(open('assets/grantho/data/rigveda/index.json', encoding='utf-8'))
          except Exception:
              d = {}
          ch10 = next((c for c in d.get('chapters', []) if c['id'] == 10), None)
          print('মণ্ডল ১০:', ch10['count'] if ch10 else 0, 'মন্ত্র')
          PY
          COUNT=$(python3 -c "
          import json
          d=json.load(open('assets/grantho/data/rigveda/index.json',encoding='utf-8'))
          c=next((x for x in d['chapters'] if x['id']==10),None)
          print(c['count'] if c else 0)")
          if [ "$COUNT" = "0" ]; then
            echo "— প্রথম চেষ্টা ফল দেয়নি; সূচি-পাতার ভেতর থেকে আবার"
            python3 -u tools/fetch_ebl.py --slug rigveda --title "ঋগ্বেদ সংহিতা" \
              --word সূক্ত --match "ঋগ্বেদ ১০" --by-ordinal --want 10 \
              --into-chapter 10 --only-unsaved --max 250 2>&1 | tail -20
          else
            echo "✓ মণ্ডল ১০-এ $COUNT মন্ত্র আছে"
          fi

      # ── গীতা (যাচাই/পুনরুদ্ধার) ─────────────────────────────────────────
      - name: গীতা — যাচাই
        if: env.TARGET == 'gita' || env.TARGET == 'all'
        run: |
          python3 - <<'PY'
          import json
          d = json.load(open('assets/grantho/data/gita/index.json', encoding='utf-8'))
          print(f"গীতা: {d['withBn']}/{d['total']} শ্লোক · {len(d['chapters'])} অধ্যায়")
          PY

      - name: রিপোর্ট
        if: always()
        run: |
          for r in assets/grantho/data/_fetch_report_*.txt; do
            [ -e "$r" ] || continue
            echo "--- $r"; head -3 "$r"
          done

      # বিল্ড ব্যর্থ হলে (ডেটা হঠাৎ ছোট) কিছুই কমিট/প্রকাশ হবে না
      - name: সাইট-পাতা বিল্ড
        if: always()
        run: python3 -u tools/build_pages.py 2>&1 | tail -20

      - name: কমিট + প্রকাশ (PR → main, auto-merge)
        if: always() && success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git add grantho assets/grantho/data assets/grantho/data/_debug/probe.txt 2>/dev/null || git add grantho assets/grantho/data || true
          if git diff --cached --quiet; then
            echo "কোনো পরিবর্তন নেই — প্রকাশ লাগবে না"; exit 0
          fi
          git commit -m "ঋগ্বেদ ১০ম মণ্ডল: স্বয়ংক্রিয় আপডেট ($(date -u +%d/%m %H:%M) UTC)" || true
          git fetch origin main --depth=1 || true
          git rebase origin/main || git rebase --abort || true
          git push origin "HEAD:refs/heads/${BOT_BRANCH}"
          NUM=$(gh pr list --head "${BOT_BRANCH}" --state open --json number -q '.[0].number' || true)
          if [ -z "$NUM" ]; then
            gh pr create --base main --head "${BOT_BRANCH}" \
              --title "ঋগ্বেদ: ১০ম মণ্ডলের নতুন সূক্ত ($(date -u +%d/%m %H:%M) UTC)" \
              --body "স্বয়ংক্রিয় ফেচ — ১০ম মণ্ডলের নতুন সূক্ত যোগ ও পাতা-বিল্ড।" || true
            sleep 5
            NUM=$(gh pr list --head "${BOT_BRANCH}" --state open --json number -q '.[0].number' || true)
          fi
          echo "PR: ${NUM:-নেই}"
          [ -n "$NUM" ] && gh pr merge "$NUM" --merge
