name: Fetch Bengali (ebanglalibrary)

on:
  push:
    paths:
      - '.github/workflows/fetch-ebl.yml'
      - 'tools/fetch_ebl.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch-ebl
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      # ---- : URL-আবিষ্কার + ছান্দোগ্য (৮ অধ্যায়) ----
      KW: 'অথর্ববেদ সংহিতা,গরুড় পুরাণ,ভবিষ্য পুরাণ,সামবেদ সংহিতা,ঋগ্বেদ ০'
      SLUG: 'rigveda'
      TITLE: 'ঋগ্বেদ সংহিতা'
      MATCH: 'ঋগ্বেদ ০'
      ORDINAL: '0'
      CHAIN: '0'
      BOOK: '0'
      GROUPNUM: '1'
      URL: ''
      MAXN: '0'
      STARTN: '1'
      WORD: 'সূক্ত'
      DUMPN: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Discover (URL তালিকা)
        continue-on-error: true
        run: |
          mkdir -p assets/grantho/data/_debug
          : > assets/grantho/data/_debug/urls.txt
          IFS=',' read -ra arr <<< "$KW"
          for k in "${arr[@]}"; do
            echo "=== $k ===" >> assets/grantho/data/_debug/urls.txt
            python3 tools/fetch_ebl.py --discover --match "$k" 2>&1 | tee -a assets/grantho/data/_debug/urls.txt
            echo >> assets/grantho/data/_debug/urls.txt
          done
          wc -l assets/grantho/data/_debug/urls.txt

      - name: Fetch (উপনিষদ + পুরাণ)
        continue-on-error: true
        run: |
          set -x
          : > /tmp/fetch.log
          run() {
            echo "### $*"
            python3 -u tools/fetch_ebl.py "$@" 2>&1 | tee -a /tmp/fetch.log
            sleep 1
          }
          # ---- অথর্ববেদ: ১৮।০৩ থেকে শুরু হওয়া পাঠ-সিরিজের সব কাণ্ড
          run --slug atharvaveda --title "অথর্ববেদ সংহিতা" --word মন্ত্র \
              --match "অথর্ববেদ সংহিতা" --toc --max 120
          # ---- গরুড় পুরাণ (পৃথ্বীরাজ সেন)
          run --slug garuda --title "গরুড় পুরাণ" --word শ্লোক \
              --match "গরুড় পুরাণ" --toc --max 200
          # ---- ভবিষ্য পুরাণ
          run --slug bhabishya --title "ভবিষ্য পুরাণ" --word শ্লোক \
              --match "ভবিষ্য পুরাণ" --toc --max 200
          # ---- ব্রহ্ম পুরাণ
          run --slug brahma --title "ব্রহ্ম পুরাণ" --word শ্লোক \
              --match "ব্রহ্ম পুরাণ" --toc --max 200
          # ---- সামবেদ
          run --slug samaveda --title "সামবেদ সংহিতা" --word মন্ত্র \
              --match "সামবেদ সংহিতা পরিতোষ" --toc --max 240
          # ---- ঋগ্বেদ (রমেশচন্দ্র দত্ত) ০১–০৯ মণ্ডল
          run --slug rigveda --title "ঋগ্বেদ সংহিতা" --word সূক্ত \
              --match "ঋগ্বেদ ০" --by-ordinal --max 40

          echo "শেষ $(date -u +%H:%M:%S)"

      - name: Report
        if: always()
        run: |
          mkdir -p assets/grantho/data/_debug
          cp /tmp/fetch.log assets/grantho/data/_debug/fetch_log.txt 2>/dev/null || true
          echo "ক্যাশ ফাইল:"; ls -la assets/grantho/data/_debug/ || true
          echo "=== log tail ==="
          tail -40 /tmp/fetch.log 2>/dev/null || true
          echo "=== report ==="
          cat "assets/grantho/data/_fetch_report_${SLUG}.txt" 2>/dev/null || echo "(no report)"
          echo "=== all reports ==="
          for r in assets/grantho/data/_fetch_report_*.txt; do cat "$r"; echo; done 2>/dev/null || true
          echo "=== sample ch1 ==="
          python3 - <<'PY' || true
          import json, os
          f = "assets/grantho/data/%s/ch1.json" % os.environ["SLUG"]
          if os.path.exists(f):
              o = json.load(open(f, encoding="utf-8"))
              print("count:", o["count"], "| bn:", o["bn"])
              for v in o["verses"][:2]:
                  print("N:", v["n"])
                  print("SK:", (v.get("sk") or "")[:260])
                  print("BN:", (v.get("bn") or "")[:260])
                  print("--")
          else:
              print("(no ch1.json)")
          PY

      - name: Commit & push
        if: always()
        run: |
          git config user.name  "grantho-bot"
          git config user.email "bot@users.noreply.github.com"
          git add assets/grantho/data || true
          git commit -m "ebanglalibrary: ${SLUG} ($(date -u +%H:%M))" || echo "no changes"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
          git push origin "HEAD:${GITHUB_REF_NAME}" || echo "push skipped"
