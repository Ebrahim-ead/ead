name: Fetch Bengali (ebanglalibrary)

on:
  push:
    paths:
      - '.github/workflows/fetch-ebl.yml'
      - 'tools/fetch_ebl.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch-ebl
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      # ---- প্রথম রান: URL-আবিষ্কার + ছান্দোগ্য (৮ অধ্যায়) ----
      KW: 'কেন উপনিষদ,ঈশ উপনিষদ,প্রশ্ন উপনিষদ,মুণ্ডক উপনিষদ,মাণ্ডূক্য উপনিষদ,তৈত্তিরীয় উপনিষদ,ঐতরেয় উপনিষদ'
      SLUG: 'upanishad-kena'
      TITLE: 'কেন উপনিষদ'
      MATCH: 'কেন উপনিষদ'
      ORDINAL: '0'
      CHAIN: '0'
      BOOK: '0'
      GROUPNUM: '1'
      URL: ''
      MAXN: '0'
      STARTN: '1'
      WORD: 'সূক্ত'
      DUMPN: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Discover (URL তালিকা)
        continue-on-error: true
        run: |
          mkdir -p assets/grantho/data/_debug
          : > assets/grantho/data/_debug/urls.txt
          IFS=',' read -ra arr <<< "$KW"
          for k in "${arr[@]}"; do
            echo "=== $k ===" >> assets/grantho/data/_debug/urls.txt
            python3 tools/fetch_ebl.py --discover --match "$k" 2>&1 | tee -a assets/grantho/data/_debug/urls.txt
            echo >> assets/grantho/data/_debug/urls.txt
          done
          wc -l assets/grantho/data/_debug/urls.txt

      - name: Debug (শৃঙ্খল + ঐতরেয় গঠন)
        continue-on-error: true
        run: |
          python3 - <<'PY' 2>&1 | tee assets/grantho/data/_debug/dbg.txt
          import sys, re, urllib.parse
          sys.path.insert(0, "tools")
          import fetch_ebl as f
          for nm in ["কেন", "ঈশ", "প্রশ্ন", "মুণ্ডক", "মাণ্ডূক্য", "তৈত্তিরীয়", "ঐতরেয়"]:
              allu = f.sitemap_urls(f.TOPIC_SITEMAPS + f.LESSON_SITEMAPS, nm + " উপনিষদ")
              print("==", nm, len(allu), [urllib.parse.unquote(u)[-30:] for u in allu])
              if allu:
                  u = sorted(allu, key=lambda x: (0 if ("/lessons/" + nm) in urllib.parse.unquote(x) else 1, len(x)))[0]
                  for hop in range(5):
                      h = f.get(u)
                      if not h:
                          print("   load-fail", urllib.parse.unquote(u)[-35:]); break
                      nxt = f.lesson_next(h)
                      print("   hop", hop, urllib.parse.unquote(u)[-35:], "->", (urllib.parse.unquote(nxt)[-35:] if nxt else None))
                      if not nxt: break
                      u = nxt
          print("=== ঐতরেয় পাতা ===")
          allu = f.sitemap_urls(f.TOPIC_SITEMAPS + f.LESSON_SITEMAPS, "ঐতরেয় উপনিষদ")
          if allu:
              t = f.fetch_paged(allu[0])
              for ln in [x.strip() for x in t.split("
") if x.strip()][:40]:
                  print("  |", ln[:110])
          PY

      - name: Fetch (উপনিষদ + পুরাণ)
        continue-on-error: true
        run: |
          set -x
          : > /tmp/fetch.log
          run() {
            echo "### $*"
            python3 -u tools/fetch_ebl.py "$@" 2>&1 | tee -a /tmp/fetch.log
            sleep 1
          }
          # ---- বাকি উপনিষদ: লেসন-সিরিজ (প্রতি লেসন = এক খণ্ড)
          run --slug upanishad-kena --title "কেন উপনিষদ" --word মন্ত্র --match "কেন উপনিষদ" --by-ordinal --max 20
          run --slug upanishad-isha --title "ঈশ উপনিষদ" --word মন্ত্র --match "ঈশ উপনিষদ" --by-ordinal --max 20
          run --slug upanishad-prashna --title "প্রশ্ন উপনিষদ" --word মন্ত্র --match "প্রশ্ন উপনিষদ" --by-ordinal --max 20
          run --slug upanishad-mundaka --title "মুণ্ডক উপনিষদ" --word মন্ত্র --match "মুণ্ডক উপনিষদ" --by-ordinal --max 20
          run --slug upanishad-mandukya --title "মাণ্ডূক্য উপনিষদ" --word মন্ত্র --match "মাণ্ডূক্য উপনিষদ" --by-ordinal --max 20
          run --slug upanishad-taittiriya --title "তৈত্তিরীয় উপনিষদ" --word মন্ত্র --match "তৈত্তিরীয় উপনিষদ" --by-ordinal --max 20
          run --slug upanishad-aitareya --title "ঐতরেয় উপনিষদ" --word মন্ত্র --match "ঐতরেয় উপনিষদ" --by-ordinal --max 20

          echo "শেষ $(date -u +%H:%M:%S)"

      - name: Report
        if: always()
        run: |
          mkdir -p assets/grantho/data/_debug
          cp /tmp/fetch.log assets/grantho/data/_debug/fetch_log.txt 2>/dev/null || true
          echo "ক্যাশ ফাইল:"; ls -la assets/grantho/data/_debug/ || true
          echo "=== log tail ==="
          tail -40 /tmp/fetch.log 2>/dev/null || true
          echo "=== report ==="
          cat "assets/grantho/data/_fetch_report_${SLUG}.txt" 2>/dev/null || echo "(no report)"
          echo "=== all reports ==="
          for r in assets/grantho/data/_fetch_report_*.txt; do cat "$r"; echo; done 2>/dev/null || true
          echo "=== sample ch1 ==="
          python3 - <<'PY' || true
          import json, os
          f = "assets/grantho/data/%s/ch1.json" % os.environ["SLUG"]
          if os.path.exists(f):
              o = json.load(open(f, encoding="utf-8"))
              print("count:", o["count"], "| bn:", o["bn"])
              for v in o["verses"][:2]:
                  print("N:", v["n"])
                  print("SK:", (v.get("sk") or "")[:260])
                  print("BN:", (v.get("bn") or "")[:260])
                  print("--")
          else:
              print("(no ch1.json)")
          PY

      - name: Commit & push
        if: always()
        run: |
          git config user.name  "grantho-bot"
          git config user.email "bot@users.noreply.github.com"
          git add assets/grantho/data || true
          git commit -m "ebanglalibrary: ${SLUG} ($(date -u +%H:%M))" || echo "no changes"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
          git push origin "HEAD:${GITHUB_REF_NAME}" || echo "push skipped"
