name: fetch-bengali

# vivekavani.com থেকে বাংলা বঙ্গানুবাদ ব্যাচে নামিয়ে ডেটা-ফাইলে লেখে।
# চালানো: এই ফাইল বদলে push করলেই রান হয় (বা Actions ট্যাব থেকে Run workflow)।
on:
  workflow_dispatch:
    inputs:
      only:
        description: 'শুধু এই গ্রন্থ (katha|chandogya|all)'
        default: 'chandogya'
  push:
    paths:
      - '.github/workflows/fetch-bengali.yml'
      - 'tools/fetch_bengali.py'

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run fetcher
        env:
          TARGET: ${{ inputs.only || 'chandogya' }}
        run: python3 tools/fetch_bengali.py --target "$TARGET" --out assets/grantho/data

      - name: Commit & push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A assets/grantho/data
          if git diff --cached --quiet; then
            echo "কোনো পরিবর্তন নেই"
          else
            git commit -m "বাংলা বঙ্গানুবাদ: ব্যাচ-ডাউনলোড ($(date -u +%Y-%m-%d))"
            git push
          fi

      - name: Summary
        run: cat assets/grantho/data/_fetch_report.txt || true
