name: fetch-bengali

# vivekavani.com থেকে বাংলা বঙ্গানুবাদ ব্যাচে নামিয়ে ডেটা-ফাইলে লেখে।
# চালানো: এই ফাইল বা tools/fetch_bengali.py বদলে push করলেই রান হয়।
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fetch-bengali.yml'
      - 'tools/fetch_bengali.py'

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TARGET: chandogya
      DUMPN: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run fetcher
        run: |
          ARGS="--target $TARGET --out assets/grantho/data"
          if [ "$DUMPN" != "0" ] && [ -n "$DUMPN" ]; then ARGS="$ARGS --dump $DUMPN"; fi
          echo "চালাচ্ছি: python3 tools/fetch_bengali.py $ARGS"
          python3 tools/fetch_bengali.py $ARGS 2>&1 | tee /tmp/fetch.log

      - name: Report
        if: always()
        run: |
          echo '### fetch log'
          tail -40 /tmp/fetch.log 2>/dev/null || echo 'কোনো লগ নেই'
          echo '### রিপোর্ট'
          cat assets/grantho/data/_fetch_report.txt 2>/dev/null || echo '—'
          echo '### ডাম্প-ফাইল'
          ls -1 assets/grantho/data/_debug 2>/dev/null | head -20 || echo '—'
          for f in assets/grantho/data/_debug/*.txt; do
            [ -e "$f" ] || continue
            echo "===== $f"; head -40 "$f"; done

      - name: Commit & push
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A assets/grantho/data
          if git diff --cached --quiet; then
            echo "কোনো পরিবর্তন নেই"
          else
            git commit -m "বাংলা বঙ্গানুবাদ: ব্যাচ-ডাউনলোড ($(date -u +%Y-%m-%d))"
            git push
          fi
