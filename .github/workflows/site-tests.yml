name: Site Tests (পাতা ও ডেটা যাচাই)

# কেন: শুক্ল যজুর্বেদের পাতা একবার ঋগ্বেদের ডেটা লোড করেছিল — build_pages.py
# টেমপ্লেট হিসেবে অন্য গ্রন্থের পাতা নেয়, আর পরিচয়-বদলিগুলো হার্ডকোডেড
# "সামবেদ …" স্ট্রিং ধরে লেখা ছিল বলে data-base ঋগ্বেদের ফোল্ডারেই থেকে গিয়েছিল।
# পাতা দেখতে ঠিক লাগছিল (শিরোনাম/ফ্যাক্টস ঠিক), তাই চোখে পড়েনি। এই টেস্টগুলো
# সেই অমিল ধরে: প্রতিটি গ্রন্থ-পাতা নিজের ডেটাই দেখাচ্ছে কি না।

on:
  push:
    branches: [main]
    paths:
      - 'tools/build_pages.py'
      - 'tools/clean_yajurveda.py'
      - 'tools/audit_site.mjs'
      - 'tools/test_reader.mjs'
      - 'tools/check_perf.mjs'
      - 'tools/check_mobile.mjs'
      - 'assets/*.css'
      - 'assets/*.js'
      - 'assets/grantho/**'
      - 'grantho/**'
      - '*.html'            # প্রবন্ধ-পাতা যোগ/সম্পাদনা হলেও অডিট চলবে
      - 'assets/site-extra.css'
      - '.github/workflows/site-tests.yml'
    # ci-diagnostics/ ইচ্ছে করেই বাদ — ব্যর্থতার ডায়াগনস্টিক সেখানে প্রকাশ হয়,
    # তাই সেটি ট্রিগারে থাকলে নিজেরই আবার রান হতো (লুপ)।
  workflow_dispatch:

permissions:
  contents: write     # ব্যর্থ হলে ডায়াগনস্টিক প্রকাশ করতে (Actions-এর লগ পড়া যায় না)

concurrency:
  group: site-tests
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # jsdom ও টেস্ট-টুল Node 22-এ যাচাই করা; রানারের সংস্করণও একই রাখি,
          # নইলে লোকালে-পাস করা টেস্ট CI-তে ভিন্ন আচরণ করতে পারে।
          node-version: '22'

      - name: নির্ভরতা ইনস্টল
        run: |
          npm ci --no-audit --no-fund 2>&1 | tail -5 || npm i jsdom --no-audit --no-fund 2>&1 | tail -5
          node -v; node -e "console.log('jsdom', require('jsdom/package.json').version)"

      # প্রতিটি পাতায় JS error, ভাঙা স্ক্রিপ্ট, SEO, ফুটার — এবং গ্রন্থ-পরিচয়:
      # data-granth/data-base পাতার নিজের slug-এর ফোল্ডার দেখায় কি না, আর
      # চ্যাপ্টার-ফাইলের শিরোনাম/সংখ্যা index.json-এর সাথে মেলে কি না।
      - name: সাইট-অডিট
        run: |
          node tools/audit_site.mjs 2>&1 | tee /tmp/audit.txt

      # রিডার চালিয়ে দেখা: পাতার নিজের data-base থেকে ডেটা লোড করে অধ্যায়-তালিকা,
      # অধ্যায়-শিরোনাম ও প্রথম খণ্ডের পাঠ সেই গ্রন্থের চ্যাপ্টার-ফাইলের সাথে মেলে কি না।
      - name: রিডার-টেস্ট
        run: |
          node tools/test_reader.mjs 2>&1 | tee /tmp/reader.txt

      # স্ক্রল-মসৃণতার নিয়ম: প্রতি-ফ্রেমে লেআউট-পড়া নেই, will-change পুরো
      # পাতায় নেই, content-visibility সত্যিই প্রযোজ্য, TOC-এ ব্লার নেই।
      - name: পারফরম্যান্স-নিয়ম
        run: |
          node tools/check_perf.mjs 2>&1 | tee /tmp/perf.txt

      # ফোনে যা ভাঙে: viewport/lang/শিরোনাম, tap-target, ছবির মাপ (লেআউট লাফ),
      # iOS-জুম, টেবিল-overflow, blocking স্ক্রিপ্ট। নতুন চেক — বাগ ঢোকার আগেই ধরা।
      - name: মোবাইল-যাচাই
        run: |
          node tools/check_mobile.mjs 2>&1 | tee /tmp/mobile.txt

      # ব্যর্থ হলে কারণ জানা দরকার — Actions-এর লগ বাইরে থেকে পড়া যায় না,
      # তাই আউটপুট রিপোতেই প্রকাশ (নিশ্চিত করা আছে যে এতে লুপ হবে না)।
      - name: ব্যর্থ হলে ডায়াগনস্টিক প্রকাশ
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p ci-diagnostics
          {
            echo "=== Site Tests ব্যর্থ · রান $GITHUB_RUN_ID · $(date -u '+%d/%m %H:%M:%S') UTC ==="
            echo "কমিট: $GITHUB_SHA · রানার node: $(node -v)"
            echo ""
            echo "--- সাইট-অডিট আউটপুট ---"
            cat /tmp/audit.txt 2>/dev/null || echo '(অডিট-আউটপুট নেই)'
            echo ""
            echo "--- রিডার-টেস্ট আউটপুট ---"
            cat /tmp/reader.txt 2>/dev/null || echo '(রিডার-টেস্ট চলেইনি)'
            echo ""
            echo "--- পারফরম্যান্স-নিয়ম আউটপুট ---"
            cat /tmp/perf.txt 2>/dev/null || echo '(পারফরম্যান্স-চেক চলেইনি)'
            echo ""
            echo "--- মোবাইল-যাচাই আউটপুট ---"
            cat /tmp/mobile.txt 2>/dev/null || echo '(মোবাইল-চেক চলেইনি)'
          } > ci-diagnostics/site-tests.txt
          git config user.name  "grantho-bot"
          git config user.email "bot@users.noreply.github.com"
          git add ci-diagnostics/site-tests.txt
          if git diff --cached --quiet; then
            echo 'ডায়াগনস্টিকে নতুন কিছু নেই'
            exit 0
          fi
          git commit -m "ci: Site Tests ব্যর্থ — ডায়াগনস্টিক ($(date -u '+%d/%m %H:%M') UTC)"
          git fetch origin main --depth=1 || true
          git rebase origin/main || git rebase --abort || true
          git push origin HEAD:main || echo '⚠ ডায়াগনস্টিক পুশ হলো না'
