name: Mishkat fill (ফাঁকা হাদিস পূরণ)

# মিশকাতুল মাসাবিহর যেসব হাদিস-নম্বর উৎসের তালিকায় লিংকহীন (১,৩৫১টি) সেগুলো
# https://muslimbangla.com/hadith/<34945+n> পাতা থেকে নামায়, তারপর প্রতিটি
# অধ্যায় নম্বর-ক্রমে সাজিয়ে index.json হালনাগাদ করে।
#
# ফল: bot/mishkat-data ব্র্যাঞ্চে commit + artifact (mishkat-fill)।
# পুনরায় চালালে ক্যাশের কারণে কেবল বাকিগুলোই নামে — তাই limit দিয়ে ধাপে ধাপেও চালানো যায়।

on:
  # মার্জ/পুশেই চালু হয়: Actions API-তে dispatch-অনুমতি না থাকলেও এই পথে চলে।
  # ট্রিগার ফাইল ছোঁয়া = «এখন চালাও»। (paths ছোট রাখা, যাতে অন্য কিছুতে না চলে)
  push:
    branches: [main]
    paths:
      - 'assets/hadith/data/_trigger/mishkat-fill'
  workflow_dispatch:
    inputs:
      mode:
        description: 'কী করব'
        type: choice
        default: all
        options: [all, fill, build, verify, plan, probe]
      limit:
        description: 'সর্বোচ্চ কতটি পাতা নামাবে (০ = সব)'
        default: '0'
      sleep:
        description: 'প্রতি অনুরোধের মাঝে বিরতি (সেকেন্ড)'
        default: '0.8'
      probe_sample:
        description: 'probe-এ কোন নম্বরগুলো দেখবে (কমা-বাঁধা; খালি = স্বয়ংক্রিয়)'
        default: ''

permissions:
  contents: write

concurrency:
  group: mishkat-fill
  # নতুন রান এলে পুরোনোটা নিজে থেকেই বাতিল হয় — নইলে গ্রুপ-লকে নতুন রান
  # «pending»-এ আটকে থাকে আর ওই রানই বাতিল করতে পারে না (মরা-লক)।
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      PYTHONUNBUFFERED: '1'
      # মোড: dispatch-এ ইনপুট, নয়তো _trigger/mishkat-fill ফাইলের প্রথম শব্দ
      # (যেমন «probe» বা «all») — push-ট্রিগার দিয়েও মোড বাছা যায়।
      MODE: ${{ inputs.mode || 'auto' }}
      LIMIT: ${{ inputs.limit || '0' }}
      SLEEP: ${{ inputs.sleep || '0.8' }}
      PROBE_SAMPLE: ${{ inputs.probe_sample || '' }}
      BOT_BRANCH: bot/mishkat-data
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # checkout-এর পরে, নইলে _trigger ফাইলটা তখনো নামেনি (MODE=auto-তে আটকে যেত)
      - name: মোড নির্ধারণ
        run: |
          if [ "$MODE" = "auto" ] || [ -z "$MODE" ]; then
            # ট্রিগার-ফাইলের প্রথম লাইন: «<মোড> [limit] [sleep]» — যেমন «fill 25»
            if [ -f assets/hadith/data/_trigger/mishkat-fill ]; then
              read -r M L S _ <<EOF
          $(head -1 assets/hadith/data/_trigger/mishkat-fill)
          EOF
              [ -n "$M" ] && MODE="$M"
              [ -n "$L" ] && LIMIT="$L"
              [ -n "$S" ] && SLEEP="$S"
            fi
            [ -z "$MODE" ] && MODE=all
            echo "MODE=$MODE" >> "$GITHUB_ENV"
            echo "LIMIT=$LIMIT" >> "$GITHUB_ENV"
            echo "SLEEP=$SLEEP" >> "$GITHUB_ENV"
          fi
          echo "চলবে: MODE=$MODE · LIMIT=$LIMIT · SLEEP=$SLEEP"


      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: git
        run: |
          git config user.name  "mishkat-bot"
          git config user.email "bot@users.noreply.github.com"

      # আগের রানের ক্যাশ ফিরিয়ে আনি — কিন্তু ডেটা নয়: ডেটার সত্য main-ই।
      # আগে পুরো assets/hadith/data ফেরানো হতো, ফলে bot-ব্র্যাঞ্চের পুরোনো
      # (ক্রম-না-ঠিক) ডেটা main-এর সংশোধিত ডেটা ঢেকে দিত।
      - name: আগের ক্যাশ আনা (bot/mishkat-data)
        run: |
          set +e
          DBG=assets/hadith/data/_debug/mishkat
          git fetch origin "${BOT_BRANCH}" --depth=1
          if git rev-parse --verify -q "FETCH_HEAD^{commit}" >/dev/null; then
            git checkout FETCH_HEAD -- "$DBG/filled" 2>/dev/null && echo "✓ ক্যাশ ফেরত"
            git checkout FETCH_HEAD -- "$DBG/probe" 2>/dev/null || true
            git reset -q || true
            echo "ক্যাশ করা পাতা: $(ls "$DBG/filled" 2>/dev/null | wc -l)"
          else
            echo "কোনো পুরোনো ব্র্যাঞ্চ নেই — শূন্য থেকে শুরু"
          fi

      - name: ০) পরিকল্পনা
        if: always()
        run: python3 -u tools/fill_mishkat.py --plan

      - name: ০.৫) পার্সার-পরীক্ষা (probe)
        if: env.MODE == 'probe'
        run: |
          ARGS="--probe"
          if [ -n "$PROBE_SAMPLE" ]; then echo "নমুনা: $PROBE_SAMPLE"; fi
          python3 -u tools/fill_mishkat.py $ARGS 2>&1 | tail -200

      - name: ১) ফাঁকা হাদিস নামানো
        if: env.MODE == 'all' || env.MODE == 'fill'
        run: |
          ARGS="--fill --sleep ${SLEEP}"
          if [ "$LIMIT" != "0" ]; then ARGS="$ARGS --limit $LIMIT"; fi
          echo "চালাচ্ছি: $ARGS"
          python3 -u tools/fill_mishkat.py $ARGS 2>&1 | tee /tmp/fill.log | tail -80 || \
            echo "⚠ ফেচার মাঝপথে থেমেছে — যা নামেছে তা দিয়েই বিল্ড হবে"

      - name: ২) নম্বর-ক্রমে সাজানো + index হালনাগাদ
        if: env.MODE == 'all' || env.MODE == 'fill' || env.MODE == 'build'
        run: |
          set -o pipefail
          mkdir -p assets/hadith/data/_debug/mishkat
          # build.txt আগে হালনাগাদ হতো না — রিপোর্টে পুরোনো সংখ্যা দেখাত
          python3 -u tools/fill_mishkat.py --build 2>&1 \
            | tee assets/hadith/data/_debug/mishkat/build.txt | tail -60

      - name: ৩) যাচাই
        if: always()
        run: python3 -u tools/fill_mishkat.py --verify | tee /tmp/verify.txt

      - name: ৪) রিপোর্ট ফাইল
        if: always()
        run: |
          DBG=assets/hadith/data/_debug/mishkat
          mkdir -p "$DBG"
          {
            echo "mode=$MODE · limit=$LIMIT · sleep=$SLEEP · head=$(git rev-parse --short HEAD) · run=${GITHUB_RUN_ID}"
            echo "ক্যাশ করা পাতা: $(ls "$DBG/filled" 2>/dev/null | wc -l)"
            echo "--- verify"
            tail -20 /tmp/verify.txt 2>/dev/null || true
            echo "--- fill.log (শেষ ৪০ লাইন)"
            tail -40 /tmp/fill.log 2>/dev/null || true
          } > "$DBG/fill_run.txt"
          cat "$DBG/fill_run.txt"

      - name: ফল আপলোড (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mishkat-fill
          path: |
            /tmp/fill.log
            /tmp/verify.txt
            /tmp/push.log
            assets/hadith/data/mishkat/
            assets/hadith/data/index.json
            assets/hadith/data/_debug/mishkat/fill_probe.txt
            assets/hadith/data/_debug/mishkat/fill_stats.txt
          retention-days: 14
          if-no-files-found: warn

      # ফল bot-ব্র্যাঞ্চে যায়। আগে main-এর গাছ থেকে push করা হতো, তাই non-fast-forward
      # ঠেকাতো আর rebase-এর পরে HEAD bot-টিপে দাঁড়িয়ে «Everything up-to-date» বলে
      # ধাপটি «সফল» দেখাত — অথচ ব্র্যাঞ্চ বদলাত না। এখন সরাসরি bot-টিপের ওপর বসে
      # নতুন ফল কপি করে commit ⇒ সবসময় fast-forward।
      - name: ফল push (bot ব্র্যাঞ্চ)
        if: always()
        run: |
          DBG=assets/hadith/data/_debug/mishkat
          rm -rf "$DBG/rawfill" "$DBG/raw"        # কাঁচা HTML ঝুড়ি বড় — কমিটে নয়
          OUT=/tmp/out
          rm -rf "$OUT"; mkdir -p "$OUT"
          cp -r assets/hadith/data/mishkat "$OUT/mishkat" 2>/dev/null || true
          cp assets/hadith/data/index.json "$OUT/index.json" 2>/dev/null || true
          cp -r "$DBG" "$OUT/dbg" 2>/dev/null || true
          {
            echo "== bot-ব্র্যাঞ্চের টিপে বসা"
            git fetch origin "$BOT_BRANCH" --depth=1 && echo "fetch ✓" || echo "fetch ✗"
            if git rev-parse --verify -q FETCH_HEAD >/dev/null; then
              git checkout -f -B botwork FETCH_HEAD && echo "checkout bot ✓ $(git rev-parse --short HEAD)"
            else
              git checkout -f -B botwork && echo "checkout main ✓ (ব্র্যাঞ্চ ছিল না)"
            fi
            mkdir -p assets/hadith/data/_debug
            [ -d "$OUT/mishkat" ] && cp -r "$OUT/mishkat" assets/hadith/data/
            [ -f "$OUT/index.json" ] && cp "$OUT/index.json" assets/hadith/data/
            # ভেতরের ফাইলগুলো কপি করি — নইলে mishkat/dbg/ নামে ডুপ্লিকেট ফোল্ডার হয়
            [ -d "$OUT/dbg" ] && cp -r "$OUT/dbg/." assets/hadith/data/_debug/mishkat/
            git add -f assets/hadith/data
            echo "== পরিবর্তন"
            git status --porcelain | head -15
            git diff --cached --stat | tail -4
            if git diff --cached --quiet; then
              echo "কোনো পরিবর্তন নেই — push লাফ"
            else
              git commit -q -m "মিশকাত: ফাঁকা হাদিস পূরণ + নম্বর-ক্রম ($(date -u '+%d/%m %H:%M') UTC)"
              git push origin "HEAD:refs/heads/${BOT_BRANCH}" && echo "✓ ${BOT_BRANCH}-এ গেছে $(git rev-parse --short HEAD)"
            fi
          } 2>&1 | tee /tmp/push.log

      # লগ/artifact ডাউনলোড সব জায়গায় হয় না — তাই ফলটা commit-comment-এও রাখি
      # (GitHub API দিয়েই পড়া যায়)। push-এর পরে, যাতে push.log-ও ঢোকে।
      - name: ফল কমেন্টে (commit-comment)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DBG=assets/hadith/data/_debug/mishkat
          CMT=/tmp/report.md
          {
            echo "### মিশকাত fill — রিপোর্ট"
            echo ""
            echo "- মোড: \`$MODE\` · limit=\`$LIMIT\` · sleep=\`$SLEEP\` · run=${GITHUB_RUN_ID}"
            echo "- ট্রিগার কমিট: \`${GITHUB_SHA:0:7}\` · ফল ব্র্যাঞ্চ: \`${BOT_BRANCH}\`"
            echo ""
            for f in "$DBG/fill_stats.txt" "$DBG/fill_probe.txt" "$DBG/build.txt" "$DBG/fill_run.txt"; do
              [ -f "$f" ] || continue
              echo '```'
              echo "## $(basename "$f")"
              head -c 11000 "$f"
              echo '```'
            done
            echo '```'
            echo "## verify"
            head -c 3000 /tmp/verify.txt 2>/dev/null || true
            echo ""
            echo "## push"
            head -c 3000 /tmp/push.log 2>/dev/null || true
            echo '```'
          } > "$CMT"
          gh api -X POST "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/comments" \
            -F body=@"$CMT" --jq '.id' && echo "✓ কমেন্টে গেছে" || echo "⚠ কমেন্ট হলো না"
