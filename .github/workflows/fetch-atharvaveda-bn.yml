name: Fetch (অথর্ববেদ — বাংলা অনুবাদ)

# ব্যবহারকারীর অনুরোধ: হিন্দু ধর্মের ভেতরে অথর্ববেদ যোগ করা।
#
# কী ইতিমধ্যেই হয়েছে (এই ফাইলের বাইরে):
#   · ২০ কাণ্ডের সম্পূর্ণ সংস্কৃত মূল পাঠ (৬,০৭৯ মন্ত্র) Vedic Heritage Portal
#     থেকে আনা হয়েছে — tools/build_atharvaveda.py, ডেটা repo-তেই আছে।
#
# এই ওয়ার্কফ্লো কী করে:
#   · ebanglalibrary.com-এ অথর্ববেদের বাংলা অনুবাদ কাণ্ড ১–৭ পর্যন্ত
#     আছে (৫০টি লেসন; ৮–২০ লেসন-পাতায় নেই — সাইটেরই মন্তব্যে
#     অ্যাডমিন লিখেছেন «চুরি গেছে»)। তাই বাংলা যেটুকু পাওয়া যায় সেটুকু
#     নামিয়ে সংস্কৃত মন্ত্রের সঙ্গে জোড়া লাগানো হয় (--only-unsaved)।
#   · উৎসে ভবিষ্যতে বাকি কাণ্ড যোগ হলে পরের রানে স্বয়ংক্রিয়ভাবে সেগুলোও আসবে।
#
# কেন CI-তে (এবং কেন ল্যাপটপ বন্ধ থাকলেও চলবে):
#   ebanglalibrary-তে স্যান্ডবক্স থেকে সরাসরি যাওয়া যায় না, আর ১০০+ পাতা
#   নামাতে দীর্ঘ সময় লাগে। GitHub Actions-এর সার্ভারে চলে — কোনো কম্পিউটার
#   চালু রাখতে হয় না, ব্রাউজার বন্ধ করলেও চলতে থাকে।
#
# ফল পড়া: assets/grantho/data/_debug/atharvaveda_bn_*.txt

on:
  workflow_dispatch:
    inputs:
      max:
        description: 'সর্বোচ্চ কত কাণ্ড (০ = সব)'
        default: '0'
  push:
    # এই ফাইল বদলালেই একবার চালাও (main-এ মার্জ হওয়ার সঙ্গে সঙ্গে) —
    # বাইরে থেকে workflow_dispatch চালু না করা গেলেও কাজ এগোয়।
    branches: [main]
    paths:
      - '.github/workflows/fetch-atharvaveda-bn.yml'
      - 'tools/merge_atharvaveda_bn.py'
      - 'tools/build_atharvaveda.py'
  schedule:
    # মাসে একবার — উৎসে নতুন কাণ্ড যোগ হলে নিজে থেকেই ধরা পড়বে
    - cron: '20 20 1 * *'

permissions:
  contents: write

concurrency:
  group: fetch-atharvaveda-bn
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    # ৫০ লেসন × (~২০ সেকেন্ড নেটওয়ার্ক + পার্স) — ৩ ঘণ্টায় শেষ নাও হতে পারে
    timeout-minutes: 350
    env:
      PYTHONUNBUFFERED: '1'
      SLUG: atharvaveda
      MAXV: ${{ inputs.max || '0' }}
      DBG: assets/grantho/data/_debug
      BOOK_URL: https://www.ebanglalibrary.com/books/%e0%a6%85%e0%a6%a5%e0%a6%b0%e0%a7%8d%e0%a6%ac%e0%a6%ac%e0%a7%87%e0%a6%a6-%e0%a6%b8%e0%a6%82%e0%a6%b9%e0%a6%bf%e0%a6%a4%e0%a6%be-%e0%a6%b8%e0%a6%ae%e0%a7%8d%e0%a6%aa%e0%a6%be%e0%a6%a6%e0%a6%a8/
      LESSON_URL: https://www.ebanglalibrary.com/lessons/%e0%a7%a6%e0%a7%a7%e0%a6%ae-%e0%a6%95%e0%a6%be%e0%a6%a3%e0%a7%8d%e0%a6%a1-%e0%a6%aa%e0%a7%8d%e0%a6%b0%e0%a6%a5%e0%a6%ae-%e0%a6%85%e0%a6%a8%e0%a7%81%e0%a6%ac%e0%a6%be%e0%a6%95/
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: ঠিক করা (git)
        run: |
          git config user.name  "grantho-bot"
          git config user.email "bot@users.noreply.github.com"
          mkdir -p "$DBG"
          echo "রান: $GITHUB_RUN_ID · $(date -u '+%d/%m %H:%M:%S') UTC · sha ${GITHUB_SHA:0:7}" \
            > "$DBG/atharvaveda_bn_run.txt"

      # ── ০) উৎস-প্রোব ───────────────────────────────────────────
      # বাংলা আসলেই পাওয়া যায় কি না, কত লেসন আছে, একটি লেসনে মন্ত্র পার্স হয় কি না —
      # সব শেল-tee দিয়ে ফাইলে, যাতে পরের ধাপ ব্যর্থ হলেও কারণ পড়া যায়।
      - name: ০) উৎস-প্রোব
        run: |
          python3 -u - 2>&1 <<'PY' | tee "$DBG/atharvaveda_bn_probe.txt"
          import os, re, sys, urllib.parse
          sys.path.insert(0, 'tools')
          import fetch_ebl as F

          book, lesson = os.environ['BOOK_URL'], os.environ['LESSON_URL']
          wall = re.compile(r'requires a login|Accessing this book', re.I)
          deva = re.compile(r'[\u0904-\u0939\u093D\u0950\u0958-\u0961\u0972-\u097F]')

          print('=== অথর্ববেদ — ebanglalibrary বাংলা প্রোব ===')
          lessons = []
          try:
              lessons = F.book_lessons(book) or []
              print(f'বই-পাতার সূচিতে লেসন: {len(lessons)}')
              for u in lessons[:3]:
                  print('   · ' + urllib.parse.unquote(u)[-70:])
              if lessons:
                  print('   … শেষ: ' + urllib.parse.unquote(lessons[-1])[-70:])
          except Exception as e:
              print(f'বই-পাতা পড়া যায়নি: {type(e).__name__} {e}')

          for label, url in (('প্রথম অনুবাক', lesson),):
              print(f'--- {label}')
              try:
                  h = F.get(url, tries=2, timeout=30) or ''
                  print(f'    html: {len(h)} B · লগইন-দেয়াল: {bool(wall.search(h))}')
              except Exception as e:
                  print(f'    get ব্যর্থ: {type(e).__name__} {e}'); continue
              try:
                  txt = F.fetch_paged(url) or ''
                  print(f'    text: {len(txt)} B')
              except Exception as e:
                  print(f'    fetch_paged ব্যর্থ: {type(e).__name__} {e}'); continue
              try:
                  vs = F.parse_verses(txt) or []
                  print(f'    মন্ত্র: {len(vs)}')
                  for v in vs[:2]:
                      print('    নমুনা: ' + str(v.get('bn') or v.get('sk') or '')[:90])
              except Exception as e:
                  print(f'    parse_verses ব্যর্থ: {type(e).__name__} {e}')
          print('=== প্রোব শেষ ===')
          PY

      - name: ০.৫) প্রোব-ফল প্রকাশ (ডায়াগনস্টিক)
        run: |
          git add "$DBG" || true
          if git diff --cached --quiet; then
            echo 'প্রোব-ফলে নতুন কিছু নেই'; exit 0
          fi
          git commit -m "অথর্ববেদ বাংলা: উৎস-প্রোব ফল ($(date -u '+%d/%m %H:%M') UTC)" || exit 1
          git fetch origin main --depth=1 || true
          git rebase origin/main || git rebase --abort || true
          git push origin HEAD:main || { echo '⚠ প্রোব-প্রকাশ ব্যর্থ — মূল কাজ চলবে'; git reset --soft HEAD~1 || true; }

      # ── ১) বাংলা নামানো ────────────────────────────────────────
      # কাণ্ড ১–৬ যতটা পাওয়া যায়, সূক্ত-ধরে। --group-by-num শিরোনামের
      # «০১।১» ধরে কাণ্ডে ভাগ করে; ডেটা _bn/<কাণ্ড>/<সূক্ত>.json-এ জমা হয়।
      # --only-unsaved: পরের রানে শুধু বাকি অংশ।
      - name: ১) বাংলা নামানো
        run: |
          : > "$DBG/atharvaveda_bn_fetch.txt"
          # --out আলাদা কেন (গুরুত্বপূর্ণ): ডিফল্টে fetch_ebl লিখত
          # assets/grantho/data/atharvaveda/ch<N>.json-এ — অর্থাৎ সংস্কৃত মূল
          # পাঠের উপরেই বাংলা চেপে যেত। তাই বাংলা আলাদা ফোল্ডারে (
          # _bn/atharvaveda/), পরে tools/merge_atharvaveda_bn.py জোড়া লাগায়।
          python3 -u tools/fetch_ebl.py \
            --slug "$SLUG" --title "অথর্ববেদ সংহিতা" --word মন্ত্র \
            --out "assets/grantho/data/atharvaveda/_bn" \
            --group-by-num --url "$BOOK_URL" --only-unsaved \
            >> "$DBG/atharvaveda_bn_fetch.txt" 2>&1 \
            || echo "⚠ ফেচার অশূন্য কোডে শেষ হলো (বিস্তারিত ফাইলে)" >> "$DBG/atharvaveda_bn_fetch.txt"
          tail -20 "$DBG/atharvaveda_bn_fetch.txt" || true

      # ── ২) জোড়া লাগানো ────────────────────────────────────────
      # নামানো বাংলা সংস্কৃত মন্ত্রের `bn` ঘরে বসানো হয় — মন্ত্র-সংখ্যা না মিললে
      # কিছুই বসে না (অনুমান নয়)। বাংলা না পাওয়া মন্ত্রে `bn` ফাঁকাই থাকে।
      - name: ২) বাংলা জোড়া
        run: |
          # ফল _bn_merged/-এ — মূল সংস্কৃত ডেটা অটুট; বিল্ডার ওখান থেকেই পড়ে
          python3 -u tools/merge_atharvaveda_bn.py 2>&1 | tee -a "$DBG/atharvaveda_bn_fetch.txt" || true

      # ── ৩) যাচাই ───────────────────────────────────────────────
      # সংস্কৃত পাঠ কমে গেলে (ভাঙা/হারানো) কিছুই প্রকাশ হবে না।
      - name: ৩) যাচাই
        run: |
          python3 -u - 2>&1 <<'PY' | tee "$DBG/atharvaveda_bn_report.txt"
          import json, pathlib, sys
          d = pathlib.Path('assets/grantho/data/atharvaveda')
          idxp = d / 'index.json'
          if not idxp.exists():
              print('⛔ index.json নেই'); sys.exit(1)
          idx = json.loads(idxp.read_text(encoding='utf-8'))
          mp = d / '_bn_merged' / 'index.json'
          if mp.exists():
              mi = json.loads(mp.read_text(encoding='utf-8'))
              print(f'বাংলা জোড়া: {mi.get("withBn")}/{mi.get("total")} মন্ত্র')
          tot = bn = 0
          for c in idx.get('chapters', []):
              fp = d / f'ch{c["id"]}.json'
              if not fp.exists():
                  print(f'⛔ কাণ্ড {c["id"]}: ফাইল নেই'); sys.exit(1)
              j = json.loads(fp.read_text(encoding='utf-8'))
              vs = j.get('verses', [])
              ns = [v.get('n') for v in vs]
              if ns != list(range(1, len(ns) + 1)):
                  print(f'⛔ কাণ্ড {c["id"]}: মন্ত্র-নম্বর ১..N ক্রমে নয়'); sys.exit(1)
              tot += len(vs)
              bn += sum(1 for v in vs if str(v.get('bn') or '').strip())
          print(f'✓ মন্ত্র {tot} · বাংলাসহ {bn} · কাণ্ড {len(idx.get("chapters", []))}')
          if tot < 6000:
              print('⛔ মন্ত্র-সংখ্যা ৬০০০-এর কম — প্রকাশ হবে না'); sys.exit(1)
          print('=== রিপোর্ট শেষ ===')
          PY

      # ── ৪) সাইট-পাতা বিল্ড ─────────────────────────────────────
      - name: ৪) সাইট বিল্ড
        run: |
          python3 -u tools/build_pages.py 2>&1 | tee -a "$DBG/atharvaveda_bn_run.txt" | tail -8 || true
          python3 -u tools/seo.py 2>&1 | tail -3 || true

      # ── ৫) প্রকাশ ─────────────────────────────────────────────
      - name: ৫) কমিট + push
        run: |
          git add -A || true
          if git diff --cached --quiet; then
            echo 'প্রকাশ করার মতো নতুন কিছু নেই'; exit 0
          fi
          git commit -m "অথর্ববেদ: বাংলা অনুবাদ জোড়া ও সাইট বিল্ড ($(date -u '+%d/%m %H:%M') UTC)" || exit 1
          for i in 1 2 3; do
            git fetch origin main --depth=1 || true
            git rebase origin/main || { git rebase --abort || true; }
            if git push origin HEAD:main; then
              echo "✓ main-এ প্রকাশ (চেষ্টা $i)"; exit 0
            fi
            sleep 10
          done
          echo '⛔ push ব্যর্থ — ডেটা Actions-এর লগে পড়ে আছে' >&2
          exit 1
