name: Nightly Fetch + Build (ebanglalibrary)

# রাতের রক্ষক: বিল্ড → প্রকাশ → নিজেকে আবার চালু।
# (পাঠ নামানোর কাজ এখন fetch-ebl.yml-এ — কেবল গীতা + ঋগ্বেদ।)
# এখানে কোনো ফেচ নেই, তাই ভুল করে অন্য গ্রন্থ ফিরে আসতে পারে না।

on:
  schedule:
    # প্রতি ৩০ মিনিটে একবার রাতের জানালায় (UTC ১৬–২৩, ০০–০২) — টোকেন-চালু ব্যর্থ হলেও চলবে
    - cron: '*/30 16-23,0-2 * * *'
  push:
    paths:
      - '.github/workflows/night-fetch.yml'
      - 'tools/fetch_ebl.py'
      - 'tools/build_pages.py'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: night-fetch
  cancel-in-progress: false

jobs:
  night:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      PYTHONUNBUFFERED: '1'
      BOT_BRANCH: arena/bot-nightly
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: ঠিক করা (git)
        run: |
          git config user.name  "grantho-bot"
          git config user.email "bot@users.noreply.github.com"

      # রাতের রান থেকেই ফেচ-কাজ চালু হয় — আলাদা করে কাউকে চাপতে হয় না।
      - name: ০) ঋগ্বেদ ১০ম মণ্ডল — ফেচ চালু
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run fetch-ebl.yml --ref main \
            -f target=rigveda10 -f max=0 || echo "ফেচ চালু করা গেল না"

      - name: ১) রিপোর্ট
        if: always()
        run: |
          echo "=== রিপোর্ট ==="
          for r in assets/grantho/data/_fetch_report_*.txt; do echo "--- $r"; head -2 "$r"; done 2>/dev/null || true

      # নীতি: বিল্ড ব্যর্থ হলে (উদাহরণ: ডেটা হঠাৎ ছোট) কিছুই কমিট/প্রকাশ হবে না।
      - name: ২) সাইট-পাতা বিল্ড
        if: always()
        run: |
          python3 -u tools/build_pages.py 2>&1 | tail -30

      # বেসলাইন নিজে থেকে হালনাগাদ হয় — নতুন খণ্ড যোগ হলে সেটাই নতুন মাপকাঠি;
      # কমে গেলে guard_data.py আগের কমিট থেকে ফিরিয়ে আনে (data-guard.yml-ও চলে)।
      - name: ৩খ) ডেটা-বেসলাইন হালনাগাদ
        if: always() && success()
        run: |
          python3 -u tools/guard_data.py
          python3 -u tools/guard_data.py --set-baseline

      - name: ৩) কমিট + প্রকাশ (PR → main, অটো-মার্জ)
        if: always() && success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git add grantho assets/grantho/data || true
          if git diff --cached --quiet; then
            echo "কোনো পরিবর্তন নেই — প্রকাশ লাগবে না"
            exit 0
          fi
          git commit -m "ebanglalibrary: স্বয়ংক্রিয় আপডেট ($(date -u +%d/%m %H:%M) UTC)" || true
          git fetch origin main --depth=1 || true
          git rebase origin/main || git rebase --abort || true
          if ! git push origin "HEAD:refs/heads/${BOT_BRANCH}"; then
            echo "⛔ bot-ব্রাঞ্চে push হলো না — কিছু প্রকাশ করা হয়নি" >&2
            exit 1
          fi
          NUM=$(gh pr list --head "${BOT_BRANCH}" --state open --json number -q '.[0].number' || true)
          if [ -z "$NUM" ]; then
            gh pr create --base main --head "${BOT_BRANCH}" \
              --title "বাংলা অনুবাদ: স্বয়ংক্রিয় আপডেট ($(date -u +%d/%m %H:%M) UTC)" \
              --body "রাতের স্বয়ংক্রিয় রান — নতুন বাংলা অনুবাদ ও পাতা-বিল্ড।" || true
            sleep 5
            NUM=$(gh pr list --head "${BOT_BRANCH}" --state open --json number -q '.[0].number' || true)
          fi
          echo "PR: ${NUM:-নেই}"
          if [ -n "$NUM" ]; then
            gh pr merge "$NUM" --merge || { echo "⛔ merge ব্যর্থ" >&2; exit 1; }
          fi

      - name: ৪) আবার নিজেকে চালু (রাতের সিরিজ)
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          N=$(date -u +%H)
          echo "এখন UTC ঘণ্টা: $N"
          # রাতের সিরিজ: UTC ১৬–২৩ ও ০০–০২ (ঢাকা সময় ~২২টা–৮টা)
          if [ "$N" -ge 16 ] || [ "$N" -le 2 ]; then
            sleep 20
            gh workflow run night-fetch.yml --ref main || echo "পুনরায় চালু করা গেল না"
          else
            echo "দিনের বেলা — সিরিজ থামানো হলো"
          fi
